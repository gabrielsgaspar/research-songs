# The topics: one id, one label and one definition each.
#
# This file is the only place that holds topic labels and definitions. Code reads
# it through `songs.stage_30_topics.topic_ids`. The scoring prompt puts each label
# and definition into its text, so the prompt files in `prompts/scoring/` do not
# repeat them.
#
# A change to a label or a definition changes what the model is asked. Scoring
# then stops until a new decision accepts the change (see decision 0005).
#
# After an edit, rebuild the page:
#   python -m songs.stage_30_topics.topic_ids --write

version = "topics-v3.0"

[[topic]]
id = "T01"
label = "Romantic love & devotion"
definition = "Mutual, fulfilling romantic love and commitment: attraction, admiration, devotion, fidelity, and the joy of being in love."

[[topic]]
id = "T02"
label = "Romantic longing & separation"
definition = "Yearning for an absent or distant beloved; pining across physical or temporal separation when the romantic bond remains intact or potentially intact."

[[topic]]
id = "T03"
label = "Heartbreak & separation"
definition = "The pain and aftermath of a romantic relationship ending or becoming irreparably damaged: breakup, abandonment, regret, attempts to move on, and efforts to repair or reverse the rupture."

[[topic]]
id = "T04"
label = "Unrequited & hidden love"
definition = "One-sided, rejected, impossible, or concealed romantic affection; loving someone who does not, cannot, or is not known to return that love."

[[topic]]
id = "T05"
label = "Desire & casual relationships"
definition = "Physical attraction, seduction, erotic desire, and short-lived or casual romantic or sexual connections without an emphasis on lasting commitment."

[[topic]]
id = "T06"
label = "Betrayal, conflict & dysfunction"
definition = "Breaches of trust and persistent strife within romantic relationships: infidelity, deception, jealousy, possessiveness, manipulation, toxicity, and dysfunction."

[[topic]]
id = "T07"
label = "Nostalgia & memory"
definition = "Wistful remembrance of the personal or collective past, including childhood, youth, lost innocence, earlier relationships, and places or periods that have passed."

[[topic]]
id = "T08"
