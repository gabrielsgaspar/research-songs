# Lyric sources: every place that lyrics come from.
#
# One [[source]] block per source. A run record may name only an `id` from this
# file, so add the block before the first run of a new source.
# `docs/standards/lyric_sources.md` is generated from this file; a test fails
# when that page is out of date.
#
# Fields:
#   id           unique key, lower case with underscores; run records use it as `source`
#   name         the name of the site, dataset or file
#   kind         bulk_dump     a dataset file that we hold; a run sends no requests
#                site_archive  a copy of a whole site that we collected; a run sends no requests
#                manual        files that a person prepares for the project
#                live_site     a site that a run sends requests to
#                internal      a step of the project itself, not a place that lyrics come from
#                A site with a copy that we hold is `site_archive`, also when live runs are possible.
#   scope        global     the source can serve every country
#                languages  the countries of the languages in `languages` (two-letter codes;
#                           resources/language_countries.toml says which countries)
#                countries  the countries in `countries` (three-letter codes)
#   url          the address of the site or dataset; empty when not confirmed
#   stored_path  version folder of our copy, relative to the data folder; empty when there
#                is no copy or when the folder is not confirmed
#   routes       the collection routes that can use the source (`ROUTES` in run_records.py)
#   access       allowed         requests may be sent, with the delay in `request_delay_seconds`
#                blocked         do not send requests to the site; `notes` says why. A copy that we hold stays usable
#                not_applicable  the source takes no requests
#                unknown         not confirmed; confirm before a run sends requests
#   request_delay_seconds  the shortest wait between two requests, when known
#   checked      true when the entry was confirmed from code or from project records;
#                false when a part of it is inferred (`notes` says which part)
#   notes        anything a reader must know
#
# After an edit, rebuild the page:
#   python -m songs.common.lyric_sources --write


# --- Project steps -------------------------------------------------------------

[[source]]
id = "review_workbook"
