# Which tests check which rule of AGENTS.md.
#
# One [[check]] block per rule that a test checks. A rule of AGENTS.md with no
# block here is "not checked". `docs/standards/rules.md` is generated from this
# file and from AGENTS.md; a test fails when that page is out of date.
#
# Fields:
#   rule   the first words of the rule in AGENTS.md, enough to match one rule only
#   tests  the tests that fail when the rule is broken, as `file::test name`
#   part   only when the tests check a part of the rule: what they do not check
#
# After an edit, rebuild the page:
#   python -m songs.common.rules --write

# --- Data ---------------------------------------------------------------------

[[check]]
rule = "Data never goes to Git."
tests = [
    "tests/test_repo_rules.py::test_no_data_files_outside_fixtures",
    "tests/test_repo_rules.py::test_gitignore_blocks_data_and_secrets",
]

[[check]]
rule = "Code finds the local data folder"
tests = [
    "tests/test_code_rules.py::test_the_code_follows_the_rule",
    "tests/test_common.py::test_data_root_follows_the_environment_variable",
]

[[check]]
rule = "Raw data is write-once."
tests = [
    "tests/test_schemas.py::test_a_writer_checks_before_it_writes_and_never_writes_over_a_file",
    "tests/test_storage.py::test_an_object_with_other_bytes_is_an_error_and_is_kept",
    "tests/test_countries_panel.py::test_build_stops_on_absent_inputs_and_never_writes_over_a_panel",
]
part = "the shared writers refuse to write over a file; code that deletes a file by another way is not found"

[[check]]
rule = "Fixtures are small text files"
tests = ["tests/test_repo_rules.py::test_fixtures_are_small"]
part = "the size is checked; that a fixture is text is not"

[[check]]
rule = "Every text read, write and `open()`"
tests = ["tests/test_repo_rules.py::test_text_io_names_its_encoding"]

# --- This repository is public --------------------------------------------------

[[check]]
rule = "No credentials, tokens or keys"
tests = ["tests/test_repo_rules.py::test_gitignore_blocks_data_and_secrets"]
part = "Git ignores `.env` and key files; a secret typed into a tracked file is not found"

[[check]]
rule = "No personal details"
tests = ["tests/test_repo_rules.py::test_no_email_addresses_in_the_repository"]
part = "email addresses only; names and private notes are not found"

[[check]]
rule = "No identifiers of private resources"
tests = [
    "tests/test_code_rules.py::test_the_code_follows_the_rule",
    "tests/test_common.py::test_config_has_no_defaults_for_private_identifiers",
]
part = "bucket addresses outside `tests/` and defaults in the settings; a project id or a spreadsheet id is not found"

# --- Countries and runs -----------------------------------------------------------

[[check]]
rule = "Collection work is organized by country."
tests = ["tests/test_run_records.py::test_each_country_has_one_folder_named_by_its_iso3_code"]

[[check]]
rule = "Never run the same job twice."
tests = ["tests/test_campaigns.py::test_the_same_job_does_not_run_twice_without_a_reason"]
part = "a run through `record_run` that repeats a complete run with the same route, source, bulk file, delay and limits is refused unless it gives a reason; a job that differs only in a setting outside the record is not found"

[[check]]
rule = "Before a run, read the plan:"
tests = ["tests/test_docs_commands.py::test_every_documented_command_exists"]
part = "the command exists as the documents write it; that a person reads the plan is not checked"

[[check]]
rule = "A campaign is an effort with a goal for one country."
tests = ["tests/test_docs_commands.py::test_every_documented_command_exists"]
part = "the commands and options exist as the documents write them; that a person opens and closes each campaign is not checked"

[[check]]
rule = "Every collection run writes one run record"
tests = [
    "tests/test_run_records.py::test_record_run_writes_a_complete_record",
    "tests/test_run_records.py::test_record_run_writes_a_failed_record_and_raises_again",
    "tests/test_run_records.py::test_the_committed_coverage_page_is_current",
    "tests/test_lyric_sources.py::test_a_run_record_may_name_only_a_registered_source",
    "tests/test_lyric_sources.py::test_every_committed_run_record_names_a_registered_source",
    "tests/test_campaigns.py::test_a_record_of_schema_version_1_still_loads",
    "tests/test_campaign_run.py::test_a_failing_import_leaves_the_campaign_open_and_a_failed_run_record",
]
part = "a record written through `record_run` is complete, every committed record is valid, and its source is in `resources/lyric_sources.toml`; a command that writes no record is not found"

