# Languages and the countries where a source in that language is worth a run.
#
# A working table for resources/lyric_sources.toml. It is not a list of official
# languages, and it makes no claim about a country. A source with the scope
# `languages` serves the countries listed here. To change which countries a
# language reaches, edit this file only.
#
# Fields:
#   code       ISO 639-1 code, two lower-case letters
#   name       the name of the language in English
#   countries  ISO 3166-1 alpha-3 codes

