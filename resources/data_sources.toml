# External data sources: where every variable that is not lyrics comes from.
#
# One [[source]] block per source of a concept. This file is the only place
# that says which source the project uses. `docs/standards/data_sources.md` is
# generated from it; a test fails when that page is out of date.
#
# Fields:
#   id        unique key, lower case with underscores
#   concept   what the variable measures; sources of the same thing share it
#   status    canonical      the source every analysis uses (one per concept)
#             robustness     a second source, used only for robustness checks
#             supplementary  used by one analysis only; `notes` says which
#             retired        was used before; no analysis may read it
#   columns   names of the variables in the country-year panel
#   source    who publishes the data
#   version   edition or vintage; "not stated" when the download does not say
#   unit      unit of the values, when there is one
#   url       where the data comes from; empty when the exact page is not confirmed
#   raw_path  folder or file under the data folder (SONGS_DATA_ROOT); empty when
#             the raw file is not in the data folder yet
#   checked   true when source and version were confirmed from the download
#             itself; false when they come from notes only
#   notes     anything a reader must know
#
# To change a source: change `status` here, record the reason in
# docs/decisions/, and rebuild the page with
#   python -m songs.common.data_sources --write

