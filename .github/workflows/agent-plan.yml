name: Agent plan

# First stage of the agent flow: plan, build, review.
# Only trigger: the `agent-plan` label is added to an issue. No comment,
# @claude, issue_comment or pull_request triggers, on purpose.
# GitHub runs `issues` workflows from the default branch, so this file does
# nothing until it is merged to main.
on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'agent-plan'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Nothing beyond this. GITHUB_TOKEN always has metadata read, which is all
    # the guard below needs to read the collaborator role.
    permissions:
      contents: read
      issues: write
    steps:
      # 1. Guard. Runs before anything else; if it fails, no later step runs.
      #    Both the user who added the label and the author of the issue need
      #    admin or write, because the issue text goes to the planner.
      #    `permission` is admin, write, read or none (maintain counts as write,
      #    triage as read). A failed lookup (for example 404 for a user who is
      #    not a collaborator) also stops the job.
      - name: Guard - labelling user and issue author need admin or write
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          for user in "${ACTOR}" "${AUTHOR}"; do
            if ! permission="$(gh api "repos/${REPO}/collaborators/${user}/permission" --jq .permission 2>/dev/null)"; then
              echo "::error::Could not look up the permission of ${user}."
              exit 1
            fi
            echo "User ${user} has permission: ${permission}"
            case "${permission}" in
              admin | write) ;;
              *)
                echo "::error::${user} needs admin or write access to run the planner."
                exit 1
                ;;
            esac
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # After the guard, so only authorized users reach its `sudo` calls.
      - uses: ./.github/actions/claude-sandbox

      # 2. The issue text goes to a file, through env vars (never inline in the
      #    script), so the agent reads it as data rather than as its prompt.
      - name: Write the issue to a file
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
        run: |
          set -euo pipefail
          mkdir -p .agent-plan
          {
            printf '# %s\n\n' "${ISSUE_TITLE}"
            printf 'Labels: %s\n\n' "${LABELS}"
            printf '%s\n' "${ISSUE_BODY}"
          } > .agent-plan/issue.md

      # The planner's instructions, model and turn limit live in
      # prompts/roles/planner.md; src/songs/common/roles.py checks and loads
      # them. It uses the standard library only, so the runner's python3 runs it.
      - name: Load the planner's instructions
        id: role
        run: python3 -I src/songs/common/roles.py planner

      # 3. Claude, read-only.
      #    `settings` turns the Bash sandbox on and makes Claude Code refuse
      #    to start without it. autoAllowBashIfSandboxed is false: with the
      #    default (true), any sandboxed command runs without matching
      #    --allowedTools, so the allowlist would not be enforced.
      #    blockReadsOutsideWorkingDirectories makes Read, Grep and Glob refuse
      #    everything outside the checkout.
      #    https://code.claude.com/docs/en/permissions#how-path-patterns-match
      #    `--tools` limits which built-in tools exist; --allowedTools limits
      #    Bash to git log; --disallowedTools removes MCP tools, blocks
      #    `--output` (which would let git write a file) and `--no-index`
      #    (which lets git read any file), and denies Read of the runner's
      #    system and credential paths. Absolute path rules start with `//`;
      #    none of them covers the checkout. `git diff` is not allowed at all:
      #    with one path outside the work tree it reads that file even without
      #    --no-index. `git log -p` refuses such paths.
      #    The result comes back as structured output.
      - name: Plan
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          # Strips credentials from Bash subprocess environments (it keeps
          # GitHub tokens). The Claude process itself keeps its credentials.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token, not the Claude GitHub App: this skips the OIDC
          # exchange, so the job needs no `id-token: write`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: >-
            {"permissions":{"blockReadsOutsideWorkingDirectories":true},
            "sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false,"autoAllowBashIfSandboxed":false,
            "network":{"allowedDomains":["pypi.org","files.pythonhosted.org"],"deniedDomains":["github.com","api.github.com"]}}}
          claude_args: |
            --model ${{ steps.role.outputs.model }}
            --max-turns ${{ steps.role.outputs.max_turns }}
            --tools "Read,Grep,Glob,Bash"
            --allowedTools "Read" "Grep" "Glob" "Bash(git log *)"
            --disallowedTools "mcp__*" "Edit" "Write" "NotebookEdit" "Bash(* --output*)" "Bash(git diff --no-index*)" "Bash(* --no-index*)" "Read(./.git/config)" "Read(//proc/**)" "Read(//etc/**)" "Read(//root/**)" "Read(//tmp/**)" "Read(//home/runner/.*)" "Read(//home/runner/.*/**)" "Read(//home/runner/work/_temp/**)" "Read(//home/runner/work/_actions/**)" "Read(//home/runner/work/_tool/**)" "Read(//home/runner/runners/**)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["plan","unclear","out_of_scope"]},"comment":{"type":"string"},"files":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"change":{"type":"string","enum":["add","modify","delete"]},"why":{"type":"string"}},"required":["path","change"]}}},"required":["status","comment"]}'
          prompt: ${{ steps.role.outputs.prompt }}

      # 4. One comment, written by a deterministic step with the job token.
      #    The agent has no way to post it. Skipped when the guard failed.
      #    Before posting, the comment is checked for the two token values and
      #    for common token prefixes; on a match nothing is posted. The values
      #    are compared inside bash (never printed, never in a command line).
      - name: Post the plan comment
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          # Compose the comment. Any problem (no usable result, a bad file
          # list) produces a short "withheld" notice instead, so the reason
          # shows on the issue, not only in this log. The build refuses a
          # withheld plan: it only accepts "## Agent plan: Plan".
          python3 -I - <<'PY'
          import json, os, re, sys

          # Paths AGENTS.md puts out of scope for agents, always. Keep this
          # list the same as in agent-build.yml and agent-review.yml.
          PROTECTED_DIRS = (".github/", ".claude/", "docs/decisions/", "prompts/roles/", "countries/", "overleaf/")
          PROTECTED_FILES = ("pyproject.toml", "uv.lock", "AGENTS.md", "CLAUDE.md", "tests/test_repo_rules.py", "src/songs/common/roles.py")

          out = os.path.join(os.environ["RUNNER_TEMP"], "comment.md")
          run = os.environ["RUN_URL"]
          footer = (
              "\n\n---\n_Written by the `agent-plan` workflow. Read-only: it changed "
              f"no files, labels or settings. [Run]({run})._\n"
          )


          def withheld(reason):
              with open(out, "w", encoding="utf-8") as f:
                  f.write(
                      f"## Agent plan: withheld\n\n{reason}\n\nNothing was planned. See the "
                      f"[run]({run}), fix the cause, then add `agent-plan` again.\n"
                  )
              sys.exit(0)


          try:
              data = json.loads(os.environ.get("STRUCTURED") or "")
          except ValueError:
              data = None
          if not isinstance(data, dict):
              withheld("The planner returned no usable result. Common causes: it ran out of turns, or the run failed before it finished.")
          titles = {
              "plan": "Plan",
              "unclear": "Needs clarification - no plan yet",
              "out_of_scope": "Out of scope under AGENTS.md - no plan",
          }
          status, comment = data.get("status"), (data.get("comment") or "").strip()
          if status not in titles or not comment:
              withheld("The planner returned no usable result.")
          body = comment[:60000]
          if status == "plan":
              files = data.get("files")
              if not isinstance(files, list) or not files:
                  withheld("The plan has no file list, so the build could not check what it changes.")
              path_ok = re.compile(r"[A-Za-z0-9_.][A-Za-z0-9_./-]*")
              labels = {"add": "new", "modify": "changed", "delete": "deleted with git rm"}
              clean, seen, problems = [], set(), []
              for item in files:
                  item = item if isinstance(item, dict) else {}
                  path = str(item.get("path", "")).strip().removeprefix("./")
                  change = item.get("change")
                  why = " ".join(str(item.get("why", "")).split())[:300]
                  parts = path.split("/")
                  if not path_ok.fullmatch(path) or ".." in parts or "" in parts:
                      problems.append(path or "(empty)")
                  elif change not in labels:
                      problems.append(f"{path} (change must be add, modify or delete)")
                  elif path not in seen:
                      seen.add(path)
                      clean.append({"path": path, "change": change, "why": why})
              if problems:
                  shown = ", ".join(f"`{p}`" for p in problems[:20])
                  withheld(
                      f"The plan's file list has entries that are not single full paths: {shown}. "
                      "Each file must be listed on its own, with no braces, wildcards or directories."
                  )
              protected = [
                  f["path"]
                  for f in clean
                  if f["path"] in PROTECTED_FILES
                  or f["path"].startswith(PROTECTED_DIRS)
                  or f["path"].rsplit("/", 1)[-1] in (".gitattributes", ".gitmodules")
              ]
              if protected:
                  shown = ", ".join(f"`{p}`" for p in protected[:20])
                  withheld(
                      f"The plan lists files that AGENTS.md puts out of scope for agents: {shown}. "
                      "A person changes those files. Remove that part from the issue."
                  )
              section = ["**Files to change**", ""]
              for f in clean:
                  section.append(f"- `{f['path']}` ({labels[f['change']]})" + (f": {f['why']}" if f["why"] else ""))
              block = "\n".join(section) + "\n\n"
              at = body.find("**Steps**")
              body = body[:at] + block + body[at:] if at >= 0 else body + "\n\n" + block
              # Machine-readable copy for verify and the reviewer. Paths are
              # checked above, so they cannot close the HTML comment.
              hidden = json.dumps([{"path": f["path"], "change": f["change"]} for f in clean], separators=(",", ":"))
              body += f"\n\n<!-- agent-files: {hidden} -->"
          with open(out, "w", encoding="utf-8") as f:
              f.write(f"## Agent plan: {titles[status]}\n\n{body}{footer}")
          PY
          body="$(< "${RUNNER_TEMP}/comment.md")"
          blocked=""
          # An empty value is skipped: an empty pattern would match everything.
          for secret in "${CLAUDE_CODE_OAUTH_TOKEN:-}" "${JOB_TOKEN:-}"; do
            if [ -n "${secret}" ] && [[ "${body}" == *"${secret}"* ]]; then blocked="a secret value"; fi
          done
          if grep -qE 'sk-ant-|gh[pousr]_|github_pat_|-----BEGIN|ya29\.' <<< "${body}"; then
            blocked="text that looks like a credential prefix"
          fi
          if [ -n "${blocked}" ]; then
            # The notice names the kind of match, never the text itself.
            printf '## Agent plan: withheld\n\nThe plan was not posted because it contained %s. Nothing was planned. See the [run](%s), then add `agent-plan` again.\n' \
              "${blocked}" "${RUN_URL}" > "${RUNNER_TEMP}/comment.md"
            gh issue comment "${ISSUE_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"
            echo "::error::The plan contained ${blocked}; posted a withheld notice instead."
            exit 1
          fi
          gh issue comment "${ISSUE_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"
