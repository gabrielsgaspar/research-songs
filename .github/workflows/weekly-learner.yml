name: Weekly learner

# Once a week, Claude reads the last 7 days of work and prepares one pull
# request: documentation that no longer matches the code, and at most 5 new
# rules, each with a test. prompts/roles/learner.md is its prompt.
#
# Four jobs, the same split as agent-build, so that code Claude writes never
# runs next to a write token:
#   gather   Our own code collects the week (read-only token). If nothing was
#            merged and nothing landed, the run stops here and no model runs.
#   learn    Claude edits the working tree. Read-only token, sandbox, no network.
#   verify   A fresh checkout applies the change. The check from main
#            (songs.common.weekly_learner check) refuses any file outside the
#            allowlist, more than 5 new rules, or a new rule with no test.
#            Then ruff and pytest. No secrets.
#   publish  Pushes learner/weekly-<date> with our GitHub App, opens the pull
#            request, and closes last week's learner pull request if it is
#            still open. Runs no repository code.
# Nothing here merges, force-pushes or uses id-token. A person merges.
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, 09:17 UTC
  workflow_dispatch:

concurrency:
  group: weekly-learner
  cancel-in-progress: false

env:
  UV_CACHE_DIR: /home/runner/.cache/uv

jobs:
  gather:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout and its history
      pull-requests: read # merged pull requests and their comments
      actions: read # failed workflow runs on main
    outputs:
      idle: ${{ steps.gather.outputs.idle }}
      base_sha: ${{ steps.gather.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: /home/runner/.cache/uv
      - run: uv sync --locked --all-groups
      - name: Gather the last 7 days
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "base_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          uv run python -m songs.common.weekly_learner gather "${RUNNER_TEMP}/learner-in"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.gather.outputs.idle == 'false' }}
        with:
          name: learner-context
          path: ${{ runner.temp }}/learner-in/
          if-no-files-found: error
          retention-days: 7

  learn:
    needs: gather
    if: ${{ needs.gather.outputs.idle == 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # Python and the uv cache live outside the paths the Read deny rules
    # hide, as in agent-build.
    env:
      UV_PYTHON_INSTALL_DIR: /opt/uv-python
      UV_CACHE_DIR: /opt/uv-cache
    # This job runs Claude and the tests Claude writes: read-only token.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.change.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/claude-sandbox

      - name: Load the learner's instructions
        id: role
        run: python3 -I src/songs/common/roles.py learner

      - name: uv folders outside the paths the sandbox hides
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "${UV_PYTHON_INSTALL_DIR}" "${UV_CACHE_DIR}"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: /opt/uv-cache
      - run: uv sync --locked --all-groups --managed-python

      # .agent-learner/ is in .gitignore, so it never enters the change.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: learner-context
          path: .agent-learner

      # The same sandbox, token limits and Read deny rules as agent-build.
      # Edits are allowed in the checkout, but not in the paths the learner
      # may never change; verify enforces the full allowlist in any case.
      - name: Learn
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          UV_PYTHON_DOWNLOADS: never
          UV_OFFLINE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          classify_inline_comments: "false"
          settings: >-
            {"permissions":{"blockReadsOutsideWorkingDirectories":true},
            "sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false,"autoAllowBashIfSandboxed":false,"filesystem":{"allowWrite":["/opt/uv-cache"]},
            "network":{"allowedDomains":["pypi.org","files.pythonhosted.org"],"deniedDomains":["github.com","api.github.com"]},
            "credentials":{
            "envVars":[{"name":"CLAUDE_CODE_OAUTH_TOKEN","mode":"deny"},{"name":"ANTHROPIC_API_KEY","mode":"deny"},{"name":"GITHUB_TOKEN","mode":"deny"},{"name":"GH_TOKEN","mode":"deny"},{"name":"ACTIONS_RUNTIME_TOKEN","mode":"deny"},{"name":"ACTIONS_ID_TOKEN_REQUEST_TOKEN","mode":"deny"}],
            "files":[{"path":"~/.claude/.credentials.json","mode":"deny"},{"path":"~/.claude.json","mode":"deny"}]}}}
          claude_args: |
            --model ${{ steps.role.outputs.model }}
            --max-turns ${{ steps.role.outputs.max_turns }}
            --tools "Read,Grep,Glob,Edit,Write,Bash"
            --allowedTools "Read" "Grep" "Glob" "Edit(./**)" "Bash(uv run ruff *)" "Bash(uv run pytest *)" "Bash(uv run python -m songs.common.rules --write)" "Bash(uv run python -m songs.common.weekly_learner check)" "Bash(git status)" "Bash(git diff *)" "Bash(git log *)" "Bash(git show *)"
            --disallowedTools "mcp__*" "NotebookEdit" "WebFetch" "WebSearch" "Edit(./.git/**)" "Edit(./.agent-learner/**)" "Edit(./.github/**)" "Edit(./.claude/**)" "Edit(./src/**)" "Edit(./prompts/**)" "Edit(./countries/**)" "Edit(./docs/decisions/**)" "Edit(./docs/status/**)" "Edit(./pyproject.toml)" "Edit(./uv.lock)" "Bash(* --output*)" "Bash(* --no-index*)" "Read(./.git/config)" "Read(//proc/**)" "Read(//etc/**)" "Read(//root/**)" "Read(//tmp/**)" "Read(//home/runner/.*)" "Read(//home/runner/.*/**)" "Read(//home/runner/work/_temp/**)" "Read(//home/runner/work/_actions/**)" "Read(//home/runner/work/_tool/**)" "Read(//home/runner/runners/**)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["changes","nothing","blocked"]},"summary":{"type":"string"}},"required":["status","summary"]}'
          prompt: ${{ steps.role.outputs.prompt }}

      # Claude's result. This step holds the two token values, so it runs
      # no git and nothing from the checkout. The summary becomes the pull
      # request text only if it holds no token.
      - name: Check Claude's result
        id: result
        working-directory: ${{ runner.temp }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          status="$(jq -r '.status // empty' <<< "${STRUCTURED:-}" 2>/dev/null || true)"
          summary="$(jq -r '.summary // empty' <<< "${STRUCTURED:-}" 2>/dev/null || true)"
          for secret in "${CLAUDE_CODE_OAUTH_TOKEN:-}" "${JOB_TOKEN:-}"; do
            if [ -n "${secret}" ] && [[ "${summary}" == *"${secret}"* ]]; then
              echo "::error::The learner's summary contains a token. Nothing is published."
              exit 1
            fi
          done
          if grep -qE 'sk-ant-|gh[pousr]_|github_pat_|-----BEGIN|ya29\.' <<< "${summary}"; then
            echo "::error::The learner's summary looks like it contains a token. Nothing is published."
            exit 1
          fi
          mkdir -p learner-out
          printf '%s\n' "${summary:0:6000}" > learner-out/summary.md
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            changes) echo "The learner returned changes." ;;
            nothing) echo "The learner found nothing to change this week:"; cat learner-out/summary.md ;;
            blocked) echo "::error::The learner stopped:"; cat learner-out/summary.md; exit 1 ;;
            *) echo "::error::The learner did not return a usable result."; exit 1 ;;
          esac

      - name: Save the change as a patch
        id: change
        env:
          STATUS: ${{ steps.result.outputs.status }}
        run: |
          set -euo pipefail
          g() { git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c submodule.recurse=false "$@"; }
          nested="$(find . -mindepth 1 -path ./.git -prune -o -name .git -print -quit)"
          if [ -n "${nested}" ]; then
            echo "::error::The checkout contains a nested .git. Nothing is published."
            exit 1
          fi
          g add --all
          g diff --cached --binary HEAD > "${RUNNER_TEMP}/learner-out/change.patch"
          if [ "${STATUS}" = "changes" ] && [ -s "${RUNNER_TEMP}/learner-out/change.patch" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            g diff --cached --stat HEAD
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No change to publish."
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.change.outputs.changed == 'true' }}
        with:
          name: learner-change
          path: |
            ${{ runner.temp }}/learner-out/change.patch
            ${{ runner.temp }}/learner-out/summary.md
          if-no-files-found: error
          retention-days: 7

      # actions/checkout's post-job step runs git in the checkout with the
      # job token, so the checkout Claude touched is deleted first.
      - name: Remove the checkout
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          chmod -R u+rwX "${GITHUB_WORKSPACE}" 2> /dev/null || true
          find "${GITHUB_WORKSPACE}" -mindepth 1 -delete
          if [ -e "${GITHUB_WORKSPACE}/.git" ]; then
            echo "::error::Could not delete the checkout."
            exit 1
          fi

  verify:
    needs: [gather, learn]
    if: ${{ needs.learn.outputs.changed == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Two checkouts of the same commit: `main` runs the check, `work` holds
      # the change. So the check that judges the change is never code that
      # the change could have edited.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather.outputs.base_sha }}
          path: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather.outputs.base_sha }}
          path: work
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: learner-change
          path: ${{ runner.temp }}/learner-in
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: /home/runner/.cache/uv

      - name: Apply the change and run the learner check from main
        working-directory: main
        run: |
          set -euo pipefail
          git -C ../work -c core.hooksPath=/dev/null apply --index "${RUNNER_TEMP}/learner-in/change.patch"
          uv sync --locked --all-groups
          uv run python -m songs.common.weekly_learner check ../work

      - name: Rebuild the rules page, then ruff and pytest
        working-directory: work
        run: |
          set -euo pipefail
          uv sync --locked --all-groups
          uv run python -m songs.common.rules --write
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null add --all
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null diff --cached --binary HEAD > "${RUNNER_TEMP}/learner-in/final.patch"

      # The rebuilt rules page may add one file to the change, so the check
      # runs once more on the final patch.
      - name: Check the final change
        working-directory: main
        run: uv run python -m songs.common.weekly_learner check ../work

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learner-verified
          path: |
            ${{ runner.temp }}/learner-in/final.patch
            ${{ runner.temp }}/learner-in/summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Remove the checkouts
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          chmod -R u+rwX "${GITHUB_WORKSPACE}" 2> /dev/null || true
          find "${GITHUB_WORKSPACE}" -mindepth 1 -delete

  publish:
    needs: [gather, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # GITHUB_TOKEN only checks out. The push and the pull request use our
    # GitHub App, so that CI runs on the pull request. The App has no
    # Workflows permission. This job runs no repository code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gather.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: learner-verified
          path: ${{ runner.temp }}/learner-in

      - name: Commit the verified change
        id: commit
        env:
          APP_CLIENT_ID: ${{ vars.AGENT_APP_CLIENT_ID }}
          HAS_APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ -z "${APP_CLIENT_ID}" ] || [ "${HAS_APP_KEY}" != "true" ]; then
            echo "::error::The AGENT_APP_CLIENT_ID variable or the AGENT_APP_PRIVATE_KEY secret is not set, so the branch cannot be pushed."
            exit 1
          fi
          day="$(date -u +%Y-%m-%d)"
          branch="learner/weekly-${day}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null; then
            echo "::error::Branch ${branch} already exists. Delete it to run the learner again today."
            exit 1
          fi
          git switch -c "${branch}"
          git -c core.hooksPath=/dev/null apply --index "${RUNNER_TEMP}/learner-in/final.patch"
          git -c core.hooksPath=/dev/null -c user.name="weekly-learner" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Weekly learner: rules and documentation for the week to ${day}."
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "day=${day}" >> "${GITHUB_OUTPUT}"

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # No force push. The token reaches git through a credential helper that
      # reads an env var, so it is never on a command line or in .git/config.
      - name: Push the branch
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          # The single quotes are deliberate: git's helper reads PUSH_TOKEN when it runs.
          # shellcheck disable=SC2016
          helper='!f() { echo username=x-access-token; echo "password=${PUSH_TOKEN}"; }; f'
          for attempt in 1 2 3 4; do
            if git -c core.hooksPath=/dev/null -c credential.helper= -c "credential.helper=${helper}" \
              push "https://github.com/${REPO}.git" "refs/heads/${BRANCH}:refs/heads/${BRANCH}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 4 ]; then
              echo "::warning::Push attempt ${attempt} failed; retrying in 60 s."
              sleep 60
            fi
          done
          echo "::error::Pushing ${BRANCH} failed after 4 tries."
          exit 1

      - name: Open the pull request and close last week's
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          DAY: ${{ steps.commit.outputs.day }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            cat "${RUNNER_TEMP}/learner-in/summary.md"
            printf '\n---\n'
            printf '_Written by the weekly learner. Checked before this pull request opened: only allowed files changed, at most 5 new rules, each new rule has a test, ruff and pytest pass. Merge it if you agree; close it to drop it. [Run](%s)._\n' "${RUN_URL}"
          } > "${RUNNER_TEMP}/pr-body.md"
          url="$(gh pr create --base "${BASE_BRANCH}" --head "${BRANCH}" \
            --title "Weekly learner: week to ${DAY}" --body-file "${RUNNER_TEMP}/pr-body.md")"
          echo "Opened ${url}"
          gh pr list --state open --limit 50 --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"learner/weekly-\")) | select(.headRefName != \"${BRANCH}\") | .number" |
            while read -r old; do
              gh pr close "${old}" --delete-branch --comment "Replaced by ${url}. Its points were given to this week's learner as input."
            done
